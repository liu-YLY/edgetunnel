name: Deploy to Cloudflare Workers

# 推送 main 即构建校验并部署到生产 Worker（服务名 edgetunnel，域名 edt2.liuyong.eu.org）。
# 凭据与 secrets 存放在 GitHub 仓库 Secrets：CLOUDFLARE_API_TOKEN / ADMIN / KEY / UUID。
# 每次部署用 wrangler secret put 幂等重写生产 secrets，防止部署清空仪表盘凭据（自愈）。
# OFF_LOG 在 Worker 上是 plain_text 变量（同名不能再建 secret，否则报 10053），
# 由 wrangler.toml 的 keep_vars = true 保留，不纳入自愈。
# 未配置 CLOUDFLARE_API_TOKEN 的 fork 自动跳过部署，只跑校验。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '_worker.js'
      - 'wrangler.toml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Check and Deploy edgetunnel
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN: ${{ secrets.ADMIN }}
      KEY: ${{ secrets.KEY }}
      UUID: ${{ secrets.UUID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 防漂移：校验构建产物与仓库内 _worker.js 逐字节一致 + 全部测试
      - run: npm run check
      # build.yml 只跑 PR；push main 的完整门禁在这里补齐（workerd 运行时集成 + 打包 dry-run）
      - run: npm run test:runtime
      - run: npm run deploy:check

      - name: Set Workers secrets (self-healing)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -e
          for s in ADMIN KEY UUID; do
            v="${!s}"
            if [ -n "$v" ]; then
              printf '%s' "$v" | npx wrangler secret put "$s" --env '' >/dev/null
              echo "secret $s OK"
            fi
          done

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --env ''