name: Deploy to Cloudflare Workers

# 推送 main 即构建校验并部署到生产 Worker（v20251104 / edgetunnel 服务）。
# 凭据与 secrets 存放在 GitHub 仓库 Secrets：CLOUDFLARE_API_TOKEN / ADMIN / KEY / UUID / OFF_LOG。
# 每次部署用 wrangler secret put 幂等重写生产 secrets，防止部署清空仪表盘凭据（自愈）。
# 未配置 CLOUDFLARE_API_TOKEN 的 fork 自动跳过部署，只跑校验。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '_worker.js'
      - 'wrangler.toml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Check and Deploy v20251104
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN: ${{ secrets.ADMIN }}
      KEY: ${{ secrets.KEY }}
      UUID: ${{ secrets.UUID }}
      OFF_LOG: ${{ secrets.OFF_LOG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 防漂移：校验构建产物与仓库内 _worker.js 逐字节一致 + 全部测试
      - run: npm run check

      - name: Set Workers secrets (self-healing)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -e
          for s in ADMIN KEY UUID OFF_LOG; do
            v="${!s}"
            if [ -n "$v" ]; then
              printf '%s' "$v" | npx wrangler secret put "$s" --env '' >/dev/null
              echo "secret $s OK"
            fi
          done

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --env ''