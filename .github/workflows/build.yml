name: Build Drift Check

# 防漂移策略（2026-09-05 定案）：源码变更后若 _worker.js（部署产物）未同步更新，
# 本工作流直接报错提示，不做自动提交，保持 main 提交历史由人控制。
#
# 分工（2026-09-19）：本工作流只跑 pull_request，作为合并前门禁；
# push main 由 deploy.yml 承担同一套校验（check + test:runtime + deploy:check）后直接部署，
# 避免同一次 push 上两个工作流重复执行 npm ci + npm run check。
on:
  pull_request:
    paths:
      - 'src/**'
      - 'build.js'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '_worker.js'
      - 'wrangler.toml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  check:
    name: Verify _worker.js reproduces from src
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
      - run: npm run test:proto
      - run: npm run deploy:check
