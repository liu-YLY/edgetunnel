name: Upstream Mirror Sync

# =========================================================================
# 方案 B（深度分叉）工程结构
# -------------------------------------------------------------------------
# 分支语义：
#   main          : 定制开发主线，本工作流绝不直接改动它
#   upstream-main : 上游 cmliu/edgetunnel main 的镜像，始终与上游对齐
#
# 收上游更新的标准操作（手动 merge，冲突在本地可控处理）：
#   1. 等待本工作流运行（每日 00:00 UTC）或手动 Run workflow
#   2. 本地开发机执行：
#        git fetch origin
#        git merge origin/upstream-main
#   3. 解决冲突后 git push origin main，CF Pages 即自动重新部署
# =========================================================================

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # 每天 00:00 UTC
  workflow_dispatch:

jobs:
  sync_upstream_mirror:
    name: Sync upstream main -> upstream-main
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout mirror branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: upstream-main

      - name: Align mirror branch with upstream
        run: |
          git config user.name "GH Action - Upstream Mirror"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          if git diff --quiet HEAD upstream/main; then
            echo "upstream-main 已与上游一致，无需更新"
          else
            git reset --hard upstream/main
            git push --force-with-lease origin upstream-main
            echo "已同步上游到 upstream-main: $(git rev-parse --short HEAD)"
          fi
